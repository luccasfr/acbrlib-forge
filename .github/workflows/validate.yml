name: Validate ACBrLib

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Revisão SVN (vazio usa acbr.lock)
        type: string

permissions:
  contents: read

env:
  ACBR_REV: ${{ inputs.revision }}
  BUN_VERSION: '1.4.2'

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- src scripts docker patches modules.json .dockerignore .gitattributes .github/workflows)
          if [[ -n "$changed" ]]; then echo 'native=true' >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  candidate-policy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Conferir a configuração da candidata
        env:
          ACBRLIB_CANDIDATE_KEY: ${{ secrets.ACBRLIB_CANDIDATE_KEY }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Execute a aprovação técnica a partir de main."
            exit 1
          }
          [[ "$ACBRLIB_CANDIDATE_KEY" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "::error::Configure o segredo ACBRLIB_CANDIDATE_KEY com 32 bytes em hexadecimal."
            exit 1
          }

  docker:
    needs: [candidate-policy, check]
    if: |
      !cancelled() && needs.check.result == 'success' && (
        needs.check.outputs.native == 'true' ||
        needs.candidate-policy.result == 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun cli.ts build
        env:
          ACBR_TARGETS: linux-x86_64 linux-i386 windows-x86_64 windows-i386
      # O contêiner do build só carrega bibliotecas x86_64; o i386 roda na
      # mesma imagem Debian para linux/386, num kernel x86_64.
      - name: Testar o Linux i386 num contêiner linux/386
        run: |
          docker run --rm --platform linux/386 -v "$PWD/out:/out:ro" -v "$PWD/scripts:/scripts:ro" \
            debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc \
            bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 libssl3 libxml2 >/dev/null && python3 -I /scripts/smoke.py /out linux-i386'
      - if: github.event_name == 'workflow_dispatch'
        run: |
          for target in linux-x86_64 linux-i386 windows-x86_64 windows-i386; do
            bun src/candidate.ts seal "$target" out "candidates/$target"
          done
        env:
          ACBRLIB_CANDIDATE_KEY: ${{ secrets.ACBRLIB_CANDIDATE_KEY }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux-x86_64
          path: candidates/linux-x86_64/bundle.enc
          if-no-files-found: error
          retention-days: 90
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-linux-x86_64
          path: candidates/linux-x86_64/evidence.json
          if-no-files-found: error
          retention-days: 90
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux-i386
          path: candidates/linux-i386/bundle.enc
          if-no-files-found: error
          retention-days: 90
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-linux-i386
          path: candidates/linux-i386/evidence.json
          if-no-files-found: error
          retention-days: 90
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows-x86_64
          path: candidates/windows-x86_64/bundle.enc
          if-no-files-found: error
          retention-days: 90
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows-i386
          path: candidates/windows-i386/bundle.enc
          if-no-files-found: error
          retention-days: 90

  windows:
    if: github.event_name == 'workflow_dispatch'
    needs: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            python: x64
          - target: windows-i386
            python: x86
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.target }}
          path: candidates/windows
      - run: bun src/candidate.ts open "${{ matrix.target }}" candidates/windows/bundle.enc transport
        env:
          ACBRLIB_CANDIDATE_KEY: ${{ secrets.ACBRLIB_CANDIDATE_KEY }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python }}
      - run: python scripts/smoke.py transport/out "${{ matrix.target }}"
      - run: bun cli.ts record "${{ matrix.target }}" transport/out transport/candidate.tar.gz > evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 90

  macos:
    needs: candidate-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-aarch64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: brew install fpc subversion openssl@3
      - run: bun cli.ts build
        env:
          ACBR_TARGETS: ${{ matrix.target }}
      - run: bun src/candidate.ts seal "$ACBR_TARGETS" out candidates/macos
        env:
          ACBR_TARGETS: ${{ matrix.target }}
          ACBRLIB_CANDIDATE_KEY: ${{ secrets.ACBRLIB_CANDIDATE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: candidates/macos/bundle.enc
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.target }}
          path: candidates/macos/evidence.json
          if-no-files-found: error
          retention-days: 90

  matrix-complete:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [check, docker, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
