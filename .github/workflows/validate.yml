name: Validate ACBrLib

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Revisão SVN (vazio usa acbr.lock)
        type: string

permissions:
  contents: read

env:
  ACBR_REV: ${{ inputs.revision }}
  BUN_VERSION: '1.4.2'

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- src scripts docker patches modules.json .dockerignore .gitattributes .github/workflows)
          if [[ -n "$changed" ]]; then echo 'native=true' >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  candidate-policy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Conferir a configuração da candidata
        env:
          ACBRLIB_CANDIDATE_KEY: ${{ secrets.ACBRLIB_CANDIDATE_KEY }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Execute a aprovação técnica a partir de main."
            exit 1
          }
          [[ "$ACBRLIB_CANDIDATE_KEY" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "::error::Configure o segredo ACBRLIB_CANDIDATE_KEY com 32 bytes em hexadecimal."
            exit 1
          }

  docker:
    needs: [candidate-policy, check]
    if: |
      !cancelled() && needs.check.result == 'success' && (
        needs.check.outputs.native == 'true' ||
        needs.candidate-policy.result == 'success'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun cli.ts build
      - if: github.event_name == 'workflow_dispatch'
        run: |
          bun src/candidate.ts seal linux-x86_64 out candidates/linux
          bun src/candidate.ts seal windows-x86_64 out candidates/windows
        env:
          ACBRLIB_CANDIDATE_KEY: ${{ secrets.ACBRLIB_CANDIDATE_KEY }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-linux-x86_64
          path: candidates/linux/bundle.enc
          if-no-files-found: error
          retention-days: 90
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-linux-x86_64
          path: candidates/linux/evidence.json
          if-no-files-found: error
          retention-days: 90
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-windows-x86_64
          path: candidates/windows/bundle.enc
          if-no-files-found: error
          retention-days: 90

  windows:
    if: github.event_name == 'workflow_dispatch'
    needs: docker
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-windows-x86_64
          path: candidates/windows
      - run: bun src/candidate.ts open windows-x86_64 candidates/windows/bundle.enc transport
        env:
          ACBRLIB_CANDIDATE_KEY: ${{ secrets.ACBRLIB_CANDIDATE_KEY }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python scripts/smoke.py transport/out windows-x86_64
      - run: bun cli.ts record windows-x86_64 transport/out transport/candidate.tar.gz > evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-windows-x86_64
          path: evidence.json
          if-no-files-found: error
          retention-days: 90

  macos:
    needs: candidate-policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-aarch64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: brew install fpc subversion openssl@3
      - run: bun cli.ts build
        env:
          ACBR_TARGETS: ${{ matrix.target }}
      - run: bun src/candidate.ts seal "$ACBR_TARGETS" out candidates/macos
        env:
          ACBR_TARGETS: ${{ matrix.target }}
          ACBRLIB_CANDIDATE_KEY: ${{ secrets.ACBRLIB_CANDIDATE_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.target }}
          path: candidates/macos/bundle.enc
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.target }}
          path: candidates/macos/evidence.json
          if-no-files-found: error
          retention-days: 90

  matrix-complete:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [check, docker, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
